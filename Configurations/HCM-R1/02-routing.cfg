interface Loopback0
 ip address 1.1.1.1 255.255.255.255
interface GigabitEthernet0/0
 description ISP
 ip address 10.0.1.2 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 description to HCM-CORE1
 ip address 10.10.100.1 255.255.255.252
 ip ospf network point-to-point
 no shutdown
interface GigabitEthernet0/2
 description to HCM-CORE2
 ip address 10.10.100.5 255.255.255.252
 ip ospf network point-to-point
 no shutdown
crypto ikev2 proposal TVI-PROP
 encryption aes-cbc-256
 integrity sha256
 group 14
crypto ikev2 policy TVI-POL
 proposal TVI-PROP
crypto ikev2 keyring TVI-KEYS-HN
 peer HN-R1
  address 10.0.2.2
  pre-shared-key TviLabKey-HN-2026
crypto ikev2 profile TVI-PROF-HN
 match identity remote address 10.0.2.2 255.255.255.255
 identity local address 10.0.1.2
 authentication remote pre-share
 authentication local pre-share
 keyring local TVI-KEYS-HN
crypto ikev2 keyring TVI-KEYS-DN
 peer DN-R1
  address 10.0.3.2
  pre-shared-key TviLabKey-DN-2026
crypto ikev2 profile TVI-PROF-DN
 match identity remote address 10.0.3.2 255.255.255.255
 identity local address 10.0.1.2
 authentication remote pre-share
 authentication local pre-share
 keyring local TVI-KEYS-DN
crypto ipsec transform-set TVI-TS esp-aes 256 esp-sha256-hmac
 mode tunnel
crypto ipsec profile TVI-IPSEC-HN
 set transform-set TVI-TS
 set ikev2-profile TVI-PROF-HN
crypto ipsec profile TVI-IPSEC-DN
 set transform-set TVI-TS
 set ikev2-profile TVI-PROF-DN
interface Tunnel12
 description IPsec VTI to HN-R1
 ip address 192.168.12.1 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip ospf network point-to-point
 tunnel source GigabitEthernet0/0
 tunnel destination 10.0.2.2
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile TVI-IPSEC-HN
 no shutdown
interface Tunnel13
 description IPsec VTI to DN-R1
 ip address 192.168.13.1 255.255.255.252
 ip mtu 1400
 ip tcp adjust-mss 1360
 ip ospf network point-to-point
 tunnel source GigabitEthernet0/0
 tunnel destination 10.0.3.2
 tunnel mode ipsec ipv4
 tunnel protection ipsec profile TVI-IPSEC-DN
 no shutdown
router ospf 1
 router-id 1.1.1.1
 auto-cost reference-bandwidth 10000
 passive-interface default
 no passive-interface GigabitEthernet0/1
 no passive-interface GigabitEthernet0/2
 no passive-interface Tunnel12
 no passive-interface Tunnel13
 network 10.10.0.0 0.0.255.255 area 0
 network 192.168.12.0 0.0.0.3 area 0
 network 192.168.13.0 0.0.0.3 area 0
 network 1.1.1.1 0.0.0.0 area 0
 default-information originate
ip route 203.0.113.0 255.255.255.248 Null0
ip prefix-list TVI-PUBLIC-OUT seq 5 permit 203.0.113.0/29
ip prefix-list DEFAULT-ONLY seq 5 permit 0.0.0.0/0
router bgp 65001
 bgp router-id 1.1.1.1
 bgp log-neighbor-changes
 neighbor 10.0.1.1 remote-as 65000
 neighbor 10.0.1.1 description ISP
 address-family ipv4
  network 203.0.113.0 mask 255.255.255.248
  neighbor 10.0.1.1 activate
  neighbor 10.0.1.1 prefix-list TVI-PUBLIC-OUT out
  neighbor 10.0.1.1 prefix-list DEFAULT-ONLY in
