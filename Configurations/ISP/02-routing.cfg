interface Loopback0
 ip address 9.9.9.9 255.255.255.255
interface Loopback8
 ip address 8.8.8.8 255.255.255.255
interface GigabitEthernet0/0
 ip address 10.0.1.1 255.255.255.252
 no shutdown
interface GigabitEthernet0/1
 ip address 10.0.2.1 255.255.255.252
 no shutdown
interface GigabitEthernet0/2
 ip address 10.0.3.1 255.255.255.252
 no shutdown
ip prefix-list DEFAULT-ONLY seq 5 permit 0.0.0.0/0
ip prefix-list HCM-PUBLIC seq 5 permit 203.0.113.0/29
ip prefix-list HN-PUBLIC seq 5 permit 198.51.100.0/29
ip prefix-list DN-PUBLIC seq 5 permit 192.0.2.0/29
router bgp 65000
 bgp router-id 9.9.9.9
 bgp log-neighbor-changes
 neighbor 10.0.1.2 remote-as 65001
 neighbor 10.0.1.2 description HCM-R1
 neighbor 10.0.2.2 remote-as 65002
 neighbor 10.0.2.2 description HN-R1
 neighbor 10.0.3.2 remote-as 65003
 neighbor 10.0.3.2 description DN-R1
 address-family ipv4
  neighbor 10.0.1.2 activate
  neighbor 10.0.1.2 default-originate
  neighbor 10.0.1.2 prefix-list DEFAULT-ONLY out
  neighbor 10.0.1.2 prefix-list HCM-PUBLIC in
  neighbor 10.0.2.2 activate
  neighbor 10.0.2.2 default-originate
  neighbor 10.0.2.2 prefix-list DEFAULT-ONLY out
  neighbor 10.0.2.2 prefix-list HN-PUBLIC in
  neighbor 10.0.3.2 activate
  neighbor 10.0.3.2 default-originate
  neighbor 10.0.3.2 prefix-list DEFAULT-ONLY out
  neighbor 10.0.3.2 prefix-list DN-PUBLIC in
