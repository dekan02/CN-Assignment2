name: tvi
mgmt:
  network: clab
  ipv4-subnet: 172.30.30.0/24
topology:
  kinds:
    linux:
      image: quay.io/frrouting/frr:10.2.1
  nodes:
    isp:  {kind: linux, binds: [configs/isp.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons]}
    hcm:  {kind: linux, binds: [configs/hcm.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons]}
    hn:   {kind: linux, binds: [configs/hn.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons]}
    dn:   {kind: linux, binds: [configs/dn.conf:/etc/frr/frr.conf, configs/daemons:/etc/frr/daemons]}
  links:
    - endpoints: ["hcm:eth1", "isp:eth1"]
    - endpoints: ["hn:eth1",  "isp:eth2"]
    - endpoints: ["dn:eth1",  "isp:eth3"]
